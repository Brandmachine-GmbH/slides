<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>__BRAND_NAME__</title>
<style>
  :root { --ink:#181b1b; --muted:#737373; --orange:#ff5500; --line:#ececec; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#fff; color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }

  /* list ---------------------------------------------------------------- */
  main { max-width:820px; margin:0 auto; padding:56px 24px 80px; }
  h1 { font-family:"Playfair Display",Georgia,serif; font-weight:400; font-size:34px;
    letter-spacing:-0.025em; margin:0 0 4px; }
  .lede { color:var(--muted); font-size:14px; margin:0 0 26px; }
  #q { width:100%; padding:12px 15px; border:1px solid #dcdcdc; border-radius:12px;
    font:inherit; font-size:15px; outline:none; margin-bottom:8px; }
  #q:focus { border-color:var(--ink); }
  #count { color:var(--muted); font-size:12px; margin:0 0 18px; }

  .card { display:block; text-decoration:none; color:inherit; border:1px solid var(--line);
    border-radius:14px; padding:16px 18px; margin-bottom:10px; transition:border-color .15s, transform .15s; }
  .card:hover { border-color:#c9c9c9; transform:translateY(-1px); }
  .card .eyebrow { font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
    color:var(--orange); margin:0 0 5px; }
  .card h2 { font-family:"Playfair Display",Georgia,serif; font-weight:400; font-size:19px;
    letter-spacing:-0.02em; margin:0 0 6px; line-height:1.15; }
  .card .sub { color:var(--muted); font-size:13px; margin:0; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* The internal note is the one thing on this page that is NOT for a client's eyes, so it is
     built to look wrong in a screenshot: tinted, ruled, and labelled. */
  .note { margin:11px 0 0; padding:9px 12px; border-left:2px solid #e3d9c9; background:#fbf8f3;
    border-radius:0 8px 8px 0; font-size:12.5px; line-height:1.5; color:#6b6259; }
  .note b { display:block; font-size:10px; font-weight:700; letter-spacing:.13em;
    text-transform:uppercase; color:#a89b86; margin-bottom:3px; }

  .meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:11px; }
  .when { margin-left:auto; font-size:11px; color:#a0a0a0; }
  .pill { font-size:11px; border:1px solid var(--line); border-radius:999px; padding:3px 9px; color:var(--muted); }
  .pill b { color:var(--ink); font-weight:600; }
  .copy { font:inherit; font-size:11px; cursor:pointer; border:1px solid var(--line);
    background:#fafafa; border-radius:999px; padding:3px 9px; color:var(--muted); }
  .copy:hover { background:#f0f0f0; color:var(--ink); }
  /* A button rather than a link, though all it does is navigate: the whole card is already an
     <a>, and an <a> inside an <a> is invalid, so the parser hoists it out and the card breaks. */
  .edit { font:inherit; font-size:11px; cursor:pointer; border:1px solid var(--line);
    background:#fff; border-radius:999px; padding:3px 9px; color:var(--muted); }
  .edit:hover { background:#f0f0f0; color:var(--ink); }
  .empty { color:var(--muted); font-size:14px; padding:26px 0; }
  mark { background:#ffe8dc; color:inherit; border-radius:3px; }
</style>
</head>
<body>

<main id="app">
  <h1>Decks</h1>
  <p class="lede">Every deck and its passcode, newest first. <a href="/admin/logout">Log out</a></p>
  <input id="q" type="search" placeholder="Search by company, title, note or passcode…" autocomplete="off" />
  <p id="count"></p>
  <div id="list"></div>
</main>

<script>
const DECKS = __DECKS__;

// Search ignores case, spaces and punctuation, so "Acme Corp", "acmecorp" and
// "ACME-CORP" all match the same deck.
const norm = (v) => String(v).toLowerCase().replace(/[^a-z0-9]/g, "");

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
function hl(text, q) {
  const t = esc(text);
  if (!q) return t;
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? t : t.slice(0, i) + "<mark>" + t.slice(i, i + q.length) + "</mark>" + t.slice(i + q.length);
}

// "2026-08-09" -> "9 Aug 2026". Bad or missing dates just disappear rather than print NaN.
function when(iso) {
  const t = Date.parse(iso || "");
  if (Number.isNaN(t)) return "";
  const d = new Date(t);
  return `${d.getUTCDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}

function render(q) {
  const needle = norm(q);
  // Search covers the internal fields too, so a company or a contact name finds the deck
  // even when neither appears in the client-facing copy.
  const hits = DECKS.filter((d) =>
    !needle || norm(d.name + d.title + d.eyebrow + d.sub + d.company + d.note + d.passcodes.join("")).includes(needle));

  document.getElementById("count").textContent =
    `${hits.length} of ${DECKS.length} deck${DECKS.length === 1 ? "" : "s"}`;

  document.getElementById("list").innerHTML = hits.length ? hits.map((d) => `
    <a class="card" href="/${d.slug}/" target="_blank" rel="noopener">
      <p class="eyebrow">${hl(d.company || d.eyebrow || d.name, q)}</p>
      <h2>${hl(d.title, q)}</h2>
      <p class="sub">${esc(d.sub || "")}</p>
      ${d.note ? `<p class="note"><b>Internal</b>${hl(d.note, q)}</p>` : ""}
      <div class="meta">
        <span class="pill">passcode <b>${hl(d.passcodes[0] || "", q)}</b></span>
        <button class="copy" data-slug="${d.slug}">Copy link</button>
        <button class="edit" data-deck="${d.name}">Edit copy</button>
        ${when(d.date) ? `<span class="when">${when(d.date)}</span>` : ""}
      </div>
    </a>`).join("") : `<p class="empty">Nothing matches “${esc(q)}”.</p>`;
}

document.getElementById("q").addEventListener("input", (e) => render(e.target.value.trim()));

// Both buttons sit inside the card's own link, so each has to stop the card opening the deck
// underneath it.
document.getElementById("list").addEventListener("click", async (e) => {
  const edit = e.target.closest(".edit");
  if (edit) {
    e.preventDefault(); e.stopPropagation();
    location.href = "/admin/edit/" + edit.dataset.deck;
    return;
  }

  const b = e.target.closest(".copy");
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const url = location.origin + "/" + b.dataset.slug + "/";
  try { await navigator.clipboard.writeText(url); } catch {}
  const was = b.textContent; b.textContent = "Copied";
  setTimeout(() => { b.textContent = was; }, 1200);
});


render("");
document.getElementById("q").focus();
</script>
</body>
</html>
