# Three gates, and the first one matters most.
#
# check-public asserts that nothing private has landed here: no UUID outside the example deck's
# own slug, no internal.json, no generated edge-function module, nothing oversized. It runs with
# NO denylist, because the list of names worth catching cannot live in a public repo. The checks
# are shape-based for exactly that reason, so they keep working in a fork that has never heard of
# whoever wrote them.
#
# Then a real build, which is the only way to know the engine still works with no brand, no
# mockups and one example deck: the configuration that every other check is blind to.
#
# Then the package itself, installed from its own tarball into an empty folder (see
# scripts/check-package.mjs), which is the only place the ways a package breaks can show.
name: check

on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing here writes to the repo, so a compromised step has nothing to push with.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-public.mjs .
      - run: npx tsc --noEmit
      - run: make build
      # The package as a stranger gets it: packed, installed into an empty folder, init, new,
      # build, typecheck. The failures a package has only show up once it is installed.
      - run: npm run check
